version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: campusassist-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: campusassist

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusassist-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: campusassist
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE:-ADMIN2024}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusassist-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
